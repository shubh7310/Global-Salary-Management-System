version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: acme-hrms-postgres
    restart: always
    environment:
      POSTGRES_DB: acme_hrms
      POSTGRES_USER: acme_user
      POSTGRES_PASSWORD: acme_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

